<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="点菜">
<title>老公小厨</title>
<style>
:root{--bg:#fff3e8;--card:#fffdf9;--ink:#6a4a3f;--sub:#b39a8c;--line:#f8e6d8;--yellow:#ffb48f;--yellow-d:#ff9a6e;--red:#ff6f7d;--side:#ffeadb;--brown:#8a5d4d;--shadow:0 4px 14px #d9906a22}
@media(prefers-color-scheme:dark){:root{--bg:#2a211e;--card:#352a26;--ink:#f6e6dc;--sub:#a88f82;--line:#473832;--side:#2f2522;--brown:#5a3f36;--shadow:0 4px 14px #0004}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Yuanti SC","PingFang SC","Hiragino Maru Gothic ProN",-apple-system,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;padding:0}

.banner{background:linear-gradient(160deg,#ffd8bd 0%,#ffc4cd 100%);padding:calc(env(safe-area-inset-top) + 14px) 16px 46px;color:#6a4237;position:relative;flex:none;border-radius:0 0 30px 30px;overflow:visible}
.banner::before,.banner::after{position:absolute;font-size:18px;opacity:.8;animation:float 3.6s ease-in-out infinite;pointer-events:none}
.banner::before{content:"✨";right:96px;top:calc(env(safe-area-inset-top) + 8px)}
.banner::after{content:"🌸";right:20px;bottom:30px;animation-delay:1.2s}
@keyframes float{50%{transform:translateY(-5px) rotate(8deg)}}
.banner .row{display:flex;justify-content:space-between;align-items:center}
.logo{width:58px;height:58px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:34px;box-shadow:0 0 0 4px #ffffff88,var(--shadow);flex:none}
.banner h1{margin:0 0 2px;font-size:20px;letter-spacing:.5px}
.banner p{margin:0;font-size:12px;opacity:.8}
.banner .shop{display:flex;gap:12px;align-items:center}
#edit{font-size:12px;background:#ffffffaa;border-radius:14px;padding:5px 11px;color:#8a5d4d}
.notice{position:absolute;left:14px;right:14px;bottom:-16px;background:var(--card);border-radius:16px;padding:9px 14px;font-size:12px;color:var(--sub);box-shadow:var(--shadow);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.notice b{color:var(--red);margin-right:6px}

.main{flex:1;display:flex;min-height:0;margin:22px 10px 0;background:var(--card);border-radius:24px 24px 0 0;box-shadow:var(--shadow);overflow:hidden}
.side{width:80px;flex:none;overflow-y:auto;background:var(--side)}
.side button{display:block;width:100%;padding:16px 4px;font-size:13px;color:var(--sub);text-align:center;position:relative}
.side button .em{display:block;font-size:22px;margin-bottom:2px;filter:grayscale(.6);opacity:.7;transition:.2s}
.side button.on{background:var(--card);color:var(--brown);font-weight:700;border-radius:18px 0 0 18px}
.side button.on .em{filter:none;opacity:1;transform:scale(1.15)}
.side .cnt{position:absolute;top:8px;right:8px;min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;line-height:17px;font-weight:700}

.list{flex:1;overflow-y:auto;padding:0 12px 120px;scroll-behavior:smooth}
.cat{font-size:14px;color:var(--brown);padding:16px 0 6px;font-weight:700}
.cat::after{content:" ♡";color:var(--red);font-weight:400}
.item{display:flex;gap:11px;padding:10px 0;border-bottom:1.5px dashed var(--line)}
.pic{width:80px;height:80px;border-radius:20px;flex:none;display:grid;place-items:center;font-size:42px;overflow:hidden;border:3px solid #fff;box-shadow:var(--shadow)}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.info{flex:1;min-width:0;display:flex;flex-direction:column}
.info .n{font-weight:700;font-size:16px}
.info .i{color:var(--sub);font-size:12px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.info .tag{display:inline-block;margin-top:4px;font-size:10px;color:var(--red);background:#ff6f7d1c;border-radius:9px;padding:1px 7px;align-self:flex-start}
.info .bot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding-top:4px}
.price{color:var(--yellow-d);font-weight:700;font-size:13px}
.price i{font-style:normal;font-size:11px;color:var(--sub);font-weight:400}

.step{display:flex;align-items:center;gap:9px}
.step .q{min-width:16px;text-align:center;font-weight:700}
.step button{width:27px;height:27px;border-radius:50%;font-size:19px;line-height:25px;font-weight:700;text-align:center;transition:transform .12s}
.step button:active{transform:scale(.85)}
.step .add{background:linear-gradient(135deg,#ffb48f,#ff8f9d);color:#fff;box-shadow:0 3px 8px #ff8f9d66}
.step .sub{border:2px solid var(--yellow);color:var(--yellow-d)}

.cart{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 10px);height:54px;border-radius:27px;background:var(--brown);display:flex;align-items:center;z-index:20;box-shadow:0 6px 18px #8a5d4d55}
.bag{position:relative;width:58px;height:58px;margin:-10px 0 0 6px;border-radius:50%;background:#a97b6a;border:4px solid var(--bg);display:grid;place-items:center;font-size:26px;flex:none;transition:transform .2s}
.bag.has{background:linear-gradient(135deg,#ffc9a8,#ff9fae)}
.bag.pop{animation:pop .35s}
@keyframes pop{40%{transform:scale(1.25) rotate(-8deg)}}
.bag .badge{position:absolute;top:-2px;right:-2px;min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font-size:12px;line-height:20px;text-align:center;font-weight:700;padding:0 4px}
.cart .txt{flex:1;padding-left:12px;color:#fff;font-size:15px}
.cart .txt small{display:block;color:#ffd9c9;font-size:11px}
.cart .go{height:54px;padding:0 24px;border-radius:0 27px 27px 0;background:linear-gradient(135deg,#ffb48f,#ff8f9d);color:#fff;font-weight:700;font-size:16px}
.cart .go:disabled{background:#a97b6a;color:#e8cfc4}

.mask{position:fixed;inset:0;background:#4a2c2455;z-index:10;display:none}
.mask.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--card);border-radius:26px 26px 0 0;padding:0 18px calc(env(safe-area-inset-bottom) + 80px);transform:translateY(100%);transition:transform .25s;max-height:65vh;overflow-y:auto}
.sheet.show{transform:none}
.sheet .hd{display:flex;justify-content:space-between;padding:16px 0 8px;position:sticky;top:0;background:var(--card);font-weight:700;color:var(--brown)}
.sheet .hd button{color:var(--sub);font-weight:400;font-size:13px}
.sheet .it{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1.5px dashed var(--line)}
.sheet .it .e{font-size:26px}
.sheet .it .n{flex:1;font-weight:600}
.empty{text-align:center;color:var(--sub);padding:30px 0}
.foot{text-align:center;font-size:12px;color:var(--sub);padding:22px 0 6px}
.foot a{color:var(--sub);font-size:11px}

dialog{border:0;border-radius:22px;width:calc(100% - 32px);max-width:480px;background:var(--card);color:var(--ink);padding:16px}
dialog::backdrop{background:#4a2c2455}
dialog p{color:var(--sub);font-size:12px;margin:0 0 8px}
textarea{width:100%;height:50vh;border:1.5px solid var(--line);border-radius:14px;padding:10px;font:13px/1.5 ui-monospace,monospace;background:var(--bg);color:var(--ink)}
dialog menu{display:flex;gap:10px;padding:0;margin:12px 0 0}
dialog menu button{flex:1;padding:12px;border-radius:14px;background:var(--bg)}
dialog menu button.p{background:linear-gradient(135deg,#ffb48f,#ff8f9d);color:#fff;font-weight:700}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#6a4a3fe6;color:#fff;padding:9px 18px;border-radius:22px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:50;white-space:nowrap}
#toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="banner">
  <div class="row">
    <div class="shop">
      <div class="logo">🧑‍🍳</div>
      <div><h1>老公小厨 ♡ 营业中</h1><p>用爱发电 · 每一餐都为你准备</p></div>
    </div>
    <button id="edit">编辑菜单</button>
  </div>
  <div class="notice"><b>💌 小纸条</b>想吃什么点一点就好，老公会记在小本本上～</div>
</div>

<div class="main">
  <nav class="side" id="side"></nav>
  <div class="list" id="list"></div>
</div>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet"></div>

<div class="cart">
  <button class="bag" id="bag">🧺<span class="badge" id="badge" hidden>0</span></button>
  <div class="txt" id="ctxt">今天想吃什么呀～</div>
  <button class="go" id="go" disabled>就吃这些</button>
</div>

<dialog id="dlg">
  <p><b># 分类名</b> 单独一行；每道菜一行：<b>🥩 菜名: 材料 数量, 材料 数量</b></p>
  <textarea id="ta"></textarea>
  <menu><button id="share">分享到备忘录</button><button id="cancel">取消</button><button class="p" id="save">保存</button></menu>
</dialog>
<div id="toast"></div>

<script>
// 快捷指令的名字，要和 iPhone 里建的一致
const SHORTCUT_NAME = "点菜入备忘录";

const DEFAULT_MENU = `# 荤菜
🥩 红烧肉: 五花肉 500g, 冰糖 30g, 生抽, 老抽, 料酒, 姜, 八角
🍗 可乐鸡翅: 鸡翅 10个, 可乐 1罐, 姜, 生抽
🦐 油焖大虾: 大虾 500g, 葱, 姜, 蒜, 料酒, 生抽, 糖
🍳 农家一碗香: 五花肉 200g, 鸡蛋 3个, 青椒 3个, 豆豉, 小米辣, 蒜
🦞 龙虾尾: 小龙虾尾 500g, 蒜 1头, 姜, 葱, 干辣椒, 料酒
🦪 蒜蓉粉丝扇贝: 扇贝 8个, 粉丝 1把, 大蒜 1头, 小米辣, 蒸鱼豆豉油
🍖 清炖牛肋条: 牛肋条 800g, 姜, 葱, 料酒, 八角, 白萝卜 1根
🍗 卤鸡腿: 鸡腿 4个, 卤料包, 生抽, 老抽, 冰糖, 姜
# 素菜
🍅 番茄炒蛋: 番茄 2个, 鸡蛋 3个, 葱, 糖
🥬 韭菜鸡蛋: 韭菜 1把, 鸡蛋 4个
🥦 干锅花菜: 有机花菜 1颗, 五花肉片 100g, 干辣椒, 蒜, 郫县豆瓣酱, 生抽
🥔 酸辣土豆丝: 土豆 2个, 干辣椒, 白醋, 蒜
🥬 蒜蓉青菜: 青菜 300g, 大蒜 4瓣
🥦 炒时蔬: 时令蔬菜 300g, 大蒜 3瓣
# 汤羹
🌽 玉米排骨汤: 排骨 400g, 玉米 2根, 胡萝卜 1根, 姜
🥣 紫菜蛋花汤: 紫菜 1小把, 鸡蛋 2个, 虾皮
# 主食
🍚 蛋炒饭: 米饭 2碗, 鸡蛋 2个, 葱, 火腿肠
🍜 担担面: 面条 200g, 猪肉末 100g, 芽菜, 花生碎, 芝麻酱, 辣椒油, 花椒粉
🍜 卤面: 面条 300g, 五花肉 150g, 豆角 100g, 生抽, 老抽, 葱
🥭 芒果糯米饭: 糯米 200g, 芒果 2个, 椰浆 200ml, 糖`;

// 菜名 -> 实拍图（来源见 credits.html）；没有图的菜显示 emoji
const IMGS = {"红烧肉": "img/own-hongshaorou.jpg", "农家一碗香": "img/own-nongjiayiwanxiang.jpg", "龙虾尾": "img/own-longxiawei.jpg", "干锅花菜": "img/own-ganguohuacai.jpg", "可乐鸡翅": "img/01.jpg", "油焖大虾": "img/02.jpg", "蒜蓉粉丝扇贝": "img/04.jpg", "清炖牛肋条": "img/05.jpg", "卤鸡腿": "img/06.jpg", "番茄炒蛋": "img/07.jpg", "韭菜鸡蛋": "img/08.jpg", "酸辣土豆丝": "img/09.jpg", "蒜蓉青菜": "img/10.jpg", "炒时蔬": "img/11.jpg", "紫菜蛋花汤": "img/12.jpg", "蛋炒饭": "img/13.jpg", "担担面": "img/14.jpg", "卤面": "img/15.jpg", "芒果糯米饭": "img/16.jpg"};
const CATEM = {"荤菜":"🍖","素菜":"🥬","汤羹":"🍲","主食":"🍚","甜品":"🍰","饮品":"🧋"};
const catEm = n => CATEM[n] || "🍽️";
const TINTS = ["#ffe9e0","#fff3cf","#e3f4e1","#e2eefc","#f3e6fa","#ffe6ec"];
const store = {
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
};
const $ = id => document.getElementById(id);

let cats = [];          // [{name, dishes:[{id,emoji,name,ings}]}]
let qty = {};           // id -> count
let dishById = {};

function parse(text){
  const out = []; let cur = null, id = 0;
  dishById = {};
  text.split("\n").map(l=>l.trim()).filter(Boolean).forEach(l=>{
    if (l.startsWith("#")) { cur = {name:l.replace(/^#+\s*/,""), dishes:[]}; out.push(cur); return; }
    if (!cur) { cur = {name:"菜单", dishes:[]}; out.push(cur); }
    const [head, ...rest] = l.split(/[:：]/);
    const m = head.trim().match(/^(\p{Extended_Pictographic}️?)?\s*(.+)$/u);
    const d = {id:id++, emoji:m[1]||"🍽️", name:m[2],
      ings:rest.join(":").split(/[,，、]/).map(s=>s.trim()).filter(Boolean)};
    cur.dishes.push(d); dishById[d.id] = d;
  });
  return out;
}

const total = () => Object.values(qty).reduce((a,b)=>a+b,0);
const stepper = id => qty[id]
  ? `<div class="step"><button class="sub" data-s="${id}">−</button><span class="q">${qty[id]}</span><button class="add" data-a="${id}">+</button></div>`
  : `<div class="step"><button class="add" data-a="${id}">+</button></div>`;

function renderList(){
  const keep = $("list").scrollTop;
  $("list").innerHTML = cats.map((c,ci)=>
    `<div class="cat" id="c${ci}">${catEm(c.name)} ${esc(c.name)}</div>` +
    c.dishes.map(d=>`
    <div class="item">
      <div class="pic" style="background:${TINTS[d.id%TINTS.length]}">${IMGS[d.name]?`<img src="${IMGS[d.name]}" alt="" loading="lazy">`:d.emoji}</div>
      <div class="info">
        <span class="n">${esc(d.name)}</span>
        <span class="i">${esc(d.ings.join("、"))}</span>
        ${d.id%3===0?'<span class="tag">💗 老婆最爱</span>':''}
        <div class="bot"><span class="price"><i>要买</i> ${d.ings.length} <i>样</i></span><span data-st="${d.id}">${stepper(d.id)}</span></div>
      </div>
    </div>`).join("")).join("") + `<div class="foot">Made with ♡ by 老公<br><a href="credits.html">图片来源</a></div>`;
  $("list").scrollTop = keep;
  renderSide(); renderCart();
}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

let activeCat = 0;
function renderSide(){
  $("side").innerHTML = cats.map((c,i)=>{
    const n = c.dishes.reduce((a,d)=>a+(qty[d.id]||0),0);
    return `<button class="${i===activeCat?"on":""}" data-c="${i}"><span class="em">${catEm(c.name)}</span>${esc(c.name)}${n?`<span class="cnt">${n}</span>`:""}</button>`;
  }).join("");
}

function renderCart(){
  const n = total();
  $("badge").hidden = !n; $("badge").textContent = n;
  $("bag").classList.toggle("has", !!n);
  $("go").disabled = !n;
  $("ctxt").innerHTML = n ? `已点 ${n} 道菜 🍽️<small>老公收到啦，马上去买菜～</small>` : "今天想吃什么呀～";
  if ($("sheet").classList.contains("show")) renderSheet();
}

function renderSheet(){
  const ids = Object.keys(qty).map(Number).sort((a,b)=>a-b);
  $("sheet").innerHTML = `<div class="hd"><span>我点的菜 💕</span><button id="clear">🧹 重新点</button></div>` +
    (ids.length ? ids.map(id=>`<div class="it"><span class="e">${dishById[id].emoji}</span><span class="n">${esc(dishById[id].name)}</span>${stepper(id)}</div>`).join("")
                : `<div class="empty">篮子空空的～ 🥺</div>`);
}

function change(id, delta){
  const bag = $("bag"); bag.classList.remove("pop"); void bag.offsetWidth; if (delta>0) bag.classList.add("pop");
  qty[id] = (qty[id]||0) + delta;
  if (qty[id] <= 0) delete qty[id];
  renderList();
}

document.addEventListener("click", e=>{
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.a) change(+t.dataset.a, 1);
  else if (t.dataset.s) change(+t.dataset.s, -1);
  else if (t.dataset.c) { activeCat = +t.dataset.c; $("c"+activeCat).scrollIntoView({block:"start"}); renderSide(); }
  else if (t.id === "clear") { qty = {}; renderList(); toggleSheet(false); }
});

$("list").addEventListener("scroll", ()=>{
  const top = $("list").getBoundingClientRect().top + 40;
  let cur = 0;
  cats.forEach((_,i)=>{ if ($("c"+i).getBoundingClientRect().top <= top) cur = i; });
  if (cur !== activeCat) { activeCat = cur; renderSide(); }
});

function toggleSheet(show){
  if (show) renderSheet();
  $("sheet").classList.toggle("show", show);
  $("mask").classList.toggle("show", show);
}
$("bag").onclick = () => { if (total()) toggleSheet(!$("sheet").classList.contains("show")); };
$("mask").onclick = () => toggleSheet(false);

function buildText(){
  const d = new Date();
  const lines = [`🍽️ ${d.getMonth()+1}月${d.getDate()}日 点菜清单`, ""];
  Object.keys(qty).map(Number).sort((a,b)=>a-b).forEach(id=>{
    const dish = dishById[id];
    lines.push(`【${dish.name}】${qty[id]>1?" ×"+qty[id]:""}`);
    dish.ings.forEach(g=>lines.push(`☐ ${g}`));
    lines.push("");
  });
  return lines.join("\n").trim();
}

function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2200);
}

$("go").onclick = () => {
  const text = buildText();
  navigator.clipboard?.writeText(text).catch(()=>{});
  location.href = `shortcuts://run-shortcut?name=${encodeURIComponent(SHORTCUT_NAME)}&input=text&text=${encodeURIComponent(text)}`;
  toast("收到啦～老公这就去买菜 💕");
  setTimeout(()=>{ qty = {}; toggleSheet(false); renderList(); }, 800);
};

// 没建快捷指令时的备用：系统分享菜单 → 备忘录
$("share").onclick = async () => {
  if (!total()) return toast("先点几道菜");
  const text = buildText();
  if (navigator.share) { try { await navigator.share({text}); } catch(e){} }
  else { await navigator.clipboard?.writeText(text); toast("已复制，去备忘录粘贴"); }
};

function menuToText(){
  return cats.map(c=>`# ${c.name}\n`+c.dishes.map(d=>`${d.emoji} ${d.name}: ${d.ings.join(", ")}`).join("\n")).join("\n");
}
$("edit").onclick = () => { $("ta").value = menuToText(); $("dlg").showModal(); };
$("cancel").onclick = () => $("dlg").close();
$("save").onclick = () => {
  store.set("menu2", $("ta").value);
  cats = parse($("ta").value); qty = {}; activeCat = 0; renderList();
  $("dlg").close();
};

cats = parse(store.get("menu2") || DEFAULT_MENU);
renderList();
</script>
</body>
</html>
